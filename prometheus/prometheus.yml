# Collecte des metriques des deux couleurs de l'API (format OpenMetrics/Prometheus)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "churn-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api_blue:8000"]
        labels:
          color: "blue"
      - targets: ["api_green:8000"]
        labels:
          color: "green"
