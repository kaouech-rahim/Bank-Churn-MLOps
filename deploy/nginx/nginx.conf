# Proxy Blue/Green : tout le trafic passe par Nginx (port 80 du conteneur)
events {}

http {
    # Contient "upstream churn_api { server api_blue:8000; }" (ou api_green).
    # Ce fichier est reecrit par scripts/switch_traffic.py lors d'une bascule.
    include /etc/nginx/upstream.conf;

    server {
        listen 80;

        location / {
            proxy_pass http://churn_api;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
