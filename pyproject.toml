[tool.poetry]
name = "bank-churn-mlops"
version = "0.1.0"
description = "Plateforme MLOps de prediction d'attrition client bancaire - Module MLOps"
authors = ["Amir Rjeb <amir@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
scipy = "^1.13.0"
pyyaml = "^6.0.1"
dvc = {extras = ["s3"], version = "^3.67.1"}
evidently = "^0.7.23"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
black = "^24.2.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
