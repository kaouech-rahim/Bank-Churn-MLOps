# ============================================================
# CI : lint + tests (+ build Docker) a chaque push / Pull Request,
# et rapport CML publie en commentaire sur les Pull Requests.
# Aucune etape ne depend de DVC, de S3, de churn.csv ni d'un serveur MLflow.
# ============================================================
name: CI

on:
  push:
    branches: [main, "feature/**", "chore/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Poetry
        run: pipx install poetry

      - name: Installer Python (avec cache Poetry)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Installer les dependances
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: flake8
        run: poetry run flake8 src tests pipelines scripts

      - name: black
        run: poetry run black --check src tests pipelines scripts

      - name: isort
        run: poetry run isort --check-only src tests pipelines scripts

      - name: Pytest + couverture (>= 75 %)
        run: >
          poetry run pytest -q
          --cov=src --cov=pipelines --cov-report=term-missing
          --cov-fail-under=75

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t bank-churn-api:ci .
      - name: L'image tourne sous un utilisateur non-root (UID 1000)
        run: test "$(docker run --rm bank-churn-api:ci id -u)" = "1000"

  cml-report:
    name: Rapport CML sur la PR
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Installer les dependances
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - uses: iterative/setup-cml@v2

      - name: Entrainement de controle (donnees synthetiques)
        run: poetry run python -m scripts.cml_report --out cml_report

      - name: Publier le rapport en commentaire de PR
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cml_report
          cml comment create report.md
