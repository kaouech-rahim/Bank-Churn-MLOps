schema: '2.0'
stages:
  split:
    cmd: poetry run python -m src.data.split_data --config configs/config.yaml
    deps:
    - path: data/raw/churn.csv
      hash: md5
      md5: 496aee8fbfdfa1dfb6daa9dbca5d1a01
      size: 684858
    - path: src/data/load_data.py
      hash: md5
      md5: d1e0c6df4f28720cf08275c23830c0b2
      size: 875
    - path: src/data/split_data.py
      hash: md5
      md5: dfa52adb6aa0629f478f98735d19595a
      size: 3646
    params:
      configs/config.yaml:
        data.random_state: 42
        data.reference_size: 5000
    outs:
    - path: data/raw/churn_production_pool.csv
      hash: md5
      md5: e842f1f7d21bf502921c53167f9f8fd4
      size: 346666
    - path: data/raw/churn_reference.csv
      hash: md5
      md5: 299531108d253139b830875a1abbcc55
      size: 345950
  preprocess:
    cmd: poetry run python -m src.features.preprocess --config 
      configs/config.yaml
    deps:
    - path: data/raw/churn_reference.csv
      hash: md5
      md5: 299531108d253139b830875a1abbcc55
      size: 345950
    - path: src/features/preprocess.py
      hash: md5
      md5: 69296a45bbcc9cb91bee75359aaa995b
      size: 9137
    params:
      configs/config.yaml:
        data.random_state: 42
        data.test_size: 0.2
        features:
          id_columns:
          - RowNumber
          - CustomerId
          - Surname
          target_column: Exited
          binary_mapping:
            Gender:
              Male: 1
              Female: 0
          category_values:
            Geography:
            - France
            - Germany
            - Spain
          numerical_columns:
          - CreditScore
          - Age
          - Tenure
          - Balance
          - NumOfProducts
          - EstimatedSalary
        schema:
          allowed_values:
            Gender:
            - Female
            - Male
            Geography:
            - France
            - Germany
            - Spain
          ranges:
            CreditScore:
            - 300
            - 850
            Age:
            - 18
            - 100
            Tenure:
            - 0
            - 50
            Balance:
            - 0
            - 1000000
            NumOfProducts:
            - 1
            - 10
            EstimatedSalary:
            - 0
            - 1000000
            HasCrCard:
            - 0
            - 1
            IsActiveMember:
            - 0
            - 1
    outs:
    - path: data/processed/scaler_params.json
      hash: md5
      md5: 0ce72df24811255e05c44103360f44f3
      size: 367
    - path: data/processed/test.csv
      hash: md5
      md5: 9db925961c2ad104093e3c94818e3f70
      size: 86857
    - path: data/processed/train.csv
      hash: md5
      md5: b307ec34ea45b3e1549f066886907b5d
      size: 345782
  train:
    cmd: poetry run python -m src.models.train --config configs/config.yaml
    deps:
    - path: data/processed/scaler_params.json
      hash: md5
      md5: 0ce72df24811255e05c44103360f44f3
      size: 367
    - path: data/processed/test.csv
      hash: md5
      md5: 9db925961c2ad104093e3c94818e3f70
      size: 86857
    - path: data/processed/train.csv
      hash: md5
      md5: b307ec34ea45b3e1549f066886907b5d
      size: 345782
    - path: src/models/evaluate.py
      hash: md5
      md5: 03e4a5a980d0fcd98cedc00d818ba019
      size: 3594
    - path: src/models/registry.py
      hash: md5
      md5: c04f7e4090c1e941e467493c643ff187
      size: 3176
    - path: src/models/train.py
      hash: md5
      md5: 006b72ced9fea0957a875cd6819a3d3a
      size: 13346
    params:
      configs/config.yaml:
        mlflow.experiment_name: Bank-Churn
        mlflow.registered_model_name: BankChurnModel
        models:
          champion_metric: roc_auc
          decision_threshold: 0.5
          model_path: models/model.joblib
          metadata_path: models/metadata.json
          scaler_path: models/scaler_params.json
          metrics_path: reports/metrics.json
          candidates:
            LogReg-Baseline:
              algorithm: logistic_regression
              params:
                max_iter: 1000
            LogReg-Tuned:
              algorithm: logistic_regression
              params:
                max_iter: 1000
                C: 0.5
                class_weight: balanced
            RandomForest-Baseline:
              algorithm: random_forest
              params:
                n_estimators: 100
                max_depth: 6
                random_state: 42
            RandomForest-Tuned:
              algorithm: random_forest
              params:
                n_estimators: 300
                max_depth: 10
                min_samples_leaf: 5
                class_weight: balanced
                random_state: 42
            XGBoost-Baseline:
              algorithm: xgboost
              params:
                n_estimators: 200
                max_depth: 4
                learning_rate: 0.1
                random_state: 42
            XGBoost-Tuned:
              algorithm: xgboost
              params:
                n_estimators: 400
                max_depth: 4
                learning_rate: 0.05
                subsample: 0.8
                colsample_bytree: 0.8
                scale_pos_weight: 3.9
                random_state: 42
    outs:
    - path: models/metadata.json
      hash: md5
      md5: bb21d7012a125606bf6fd0c36dfdd136
      size: 1052
    - path: models/model.joblib
      hash: md5
      md5: 51adc96a2e80b02bc3667253b7b2740f
      size: 8987657
    - path: models/scaler_params.json
      hash: md5
      md5: 0ce72df24811255e05c44103360f44f3
      size: 367
    - path: reports/metrics.json
      hash: md5
      md5: 02519f6ae460db4ae1c4020b21bb136a
      size: 1049
