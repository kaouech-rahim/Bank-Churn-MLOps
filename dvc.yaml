stages:
  # Etape 1 : separer churn.csv en reference (5000 lignes) et pool de production
  split:
    cmd: poetry run python -m src.data.split_data --config configs/config.yaml
    deps:
      - src/data/split_data.py
      - src/data/load_data.py
      - data/raw/churn.csv
    params:
      - configs/config.yaml:
          - data.reference_size
          - data.random_state
    outs:
      - data/raw/churn_reference.csv
      - data/raw/churn_production_pool.csv

  # Etape 2 : nettoyage, validation du schema, split train/test, encodage
  preprocess:
    cmd: poetry run python -m src.features.preprocess --config configs/config.yaml
    deps:
      - src/features/preprocess.py
      - data/raw/churn_reference.csv
    params:
      - configs/config.yaml:
          - data.test_size
          - data.random_state
          - features
          - schema
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/scaler_params.json

  # Etape 3 : 6 runs MLflow, champion (meilleur ROC-AUC) -> Registry -> export API
  train:
    cmd: poetry run python -m src.models.train --config configs/config.yaml
    deps:
      - src/models/train.py
      - src/models/evaluate.py
      - src/models/registry.py
      - src/models/promotion.py
      - src/features/preprocess.py
      - src/data/load_data.py
      - data/raw/churn_reference.csv
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/scaler_params.json
    params:
      - configs/config.yaml:
          - models
          - features
          - data.test_size
          - data.random_state
          - mlflow.experiment_name
          - mlflow.registered_model_name
    # persist : DVC ne supprime pas le modele en service avant l'etape ; si le
    # candidat n'est pas promu, models/ reste inchange
    outs:
      - models/model.joblib:
          persist: true
      - models/metadata.json:
          cache: false
          persist: true
      - models/scaler_params.json:
          cache: false
          persist: true
    metrics:
      - reports/metrics.json:
          cache: false
