# ============================================================
# Configuration centrale du projet (aucun chemin ni seuil en dur dans le code)
# ============================================================

data:
  raw_path: "data/raw/churn.csv"                              # fichier complet (10 000 lignes)
  reference_path: "data/raw/churn_reference.csv"              # 5 000 lignes : entrainement
  production_pool_path: "data/raw/churn_production_pool.csv"  # 5 000 lignes : simulation de production / drift
  reference_size: 5000
  test_size: 0.2
  random_state: 42
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"
  scaler_path: "data/processed/scaler_params.json"

features:
  id_columns: ["RowNumber", "CustomerId", "Surname"]          # colonnes techniques a supprimer
  target_column: "Exited"                                     # 1 = le client a quitte la banque
  # Colonne binaire -> valeur numerique (la cle = nom de colonne)
  binary_mapping:
    Gender:
      Male: 1
      Female: 0
  # Colonne categorielle -> liste ordonnee des valeurs possibles
  # (la 1ere valeur est la modalite de reference, supprimee par drop_first)
  category_values:
    Geography: ["France", "Germany", "Spain"]
  numerical_columns:
    - "CreditScore"
    - "Age"
    - "Tenure"
    - "Balance"
    - "NumOfProducts"
    - "EstimatedSalary"

# Contrat de donnees : valeurs autorisees et bornes [min, max] par colonne
schema:
  allowed_values:
    Gender: ["Female", "Male"]
    Geography: ["France", "Germany", "Spain"]
  ranges:
    CreditScore: [300, 850]
    Age: [18, 100]
    Tenure: [0, 50]
    Balance: [0, 1000000]
    NumOfProducts: [1, 10]
    EstimatedSalary: [0, 1000000]
    HasCrCard: [0, 1]
    IsActiveMember: [0, 1]

drift:
  alpha: 0.05                 # seuil de significativite des tests KS et chi2
  psi_threshold: 0.10         # PSI minimal pour qu'une variable compte comme "en drift"
  drift_share_threshold: 0.30 # part de variables en drift qui declenche l'alerte critique
  bins: 10                    # nombre de tranches pour le calcul du PSI
  min_rows: 30                # taille minimale d'un echantillon analysable
  simulation_seed: 42
  report_path: "reports/drift_report.html"
  # Scenarios d'injection de drift (utilises par DriftSimulator)
  scenarios:
    none: {}                  # aucun drift : donnees inchangees
    strong:
      age_shift: 8            # +8 ans en moyenne
      balance_factor: 1.3     # soldes positifs x 1.3
      target_country: "Germany"
      target_share: 0.5       # l'Allemagne passe a ~50 % des clients

# ============================================================
# Modelisation et MLflow (TP3)
# ============================================================
mlflow:
  tracking_uri: "sqlite:///mlflow.db"          # backend store SQL (obligatoire pour le Registry)
  artifact_root: "./mlruns"                    # artifact store local
  experiment_name: "Bank-Churn"
  registered_model_name: "BankChurnModel"
  champion_alias: "champion"                   # alias pose en plus du stage Production

models:
  champion_metric: "roc_auc"                   # regle de choix du champion : meilleur ROC-AUC
  decision_threshold: 0.5                      # proba >= seuil -> churn = 1
  model_path: "models/model.joblib"            # export du champion pour l'API
  metadata_path: "models/metadata.json"
  scaler_path: "models/scaler_params.json"     # copie du scaler livree avec le modele
  metrics_path: "reports/metrics.json"         # metriques des 6 runs (lu par DVC)
  # 3 algorithmes x 2 configurations (baseline / tuned)
  candidates:
    LogReg-Baseline:
      algorithm: "logistic_regression"
      params: {max_iter: 1000}
    LogReg-Tuned:
      algorithm: "logistic_regression"
      params: {max_iter: 1000, C: 0.5, class_weight: "balanced"}
    RandomForest-Baseline:
      algorithm: "random_forest"
      params: {n_estimators: 100, max_depth: 6, random_state: 42}
    RandomForest-Tuned:
      algorithm: "random_forest"
      params: {n_estimators: 300, max_depth: 10, min_samples_leaf: 5,
               class_weight: "balanced", random_state: 42}
    XGBoost-Baseline:
      algorithm: "xgboost"
      params: {n_estimators: 200, max_depth: 4, learning_rate: 0.1, random_state: 42}
    XGBoost-Tuned:
      algorithm: "xgboost"
      params: {n_estimators: 400, max_depth: 4, learning_rate: 0.05, subsample: 0.8,
               colsample_bytree: 0.8, scale_pos_weight: 3.9, random_state: 42}

# ============================================================
# API FastAPI (TP4)
# ============================================================
api:
  max_batch_size: 1000
  risk_thresholds:            # Faible < 0.35 <= Modere < 0.70 <= Eleve
    moderate: 0.35
    high: 0.70

# ============================================================
# Orchestration Prefect et boucle de retroaction
# ============================================================
prefect:
  work_pool: "churn-pool"
  retries: 2
  retry_delay_seconds: 5
  training_cron: "0 3 * * 1"  # entrainement hebdomadaire : lundi 03:00
  drift_cron: "0 6 * * *"     # controle du drift quotidien : 06:00
  drift_scenario: "strong"    # scenario simule pour la demo (none, strong)
  batch_size: 2000            # taille du lot de production analyse
  retrain_dir: "data/retrain" # fichiers de travail du reentrainement (sources intactes)
  min_improvement: 0.0        # nouveau modele promu si AUC_new >= AUC_old + min_improvement

# ============================================================
# Monitoring Prometheus et deploiement Blue/Green
# ============================================================
monitoring:
  drift_report_json: "reports/drift_report.json"  # lu par /metrics

deployment:
  blue_url: "http://localhost:8001"
  green_url: "http://localhost:8002"
  proxy_url: "http://localhost:8000"
  nginx_upstream_file: "deploy/nginx/upstream.conf"
  active_color_file: "deploy/active_color.txt"   # couleur qui recoit le trafic
  models_dir: "deploy/models"                     # deploy/models/blue et /green
  health_timeout_seconds: 60
